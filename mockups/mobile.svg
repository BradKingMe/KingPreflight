  <text x="63" y="222" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">Choose a folder</text>

  <line x1="20" y1="264" x2="370" y2="264" stroke="#deddd4"/>
  <text x="20" y="290" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#747970" letter-spacing="1.2">DEMO REVIEW</text>
