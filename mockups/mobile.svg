  <text x="20" y="320" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#25342c">Client handoff</text>
  <text x="20" y="339" font-family="Arial,sans-serif" font-size="11" fill="#566158">/ deliverables / june · 18 files</text>

  <rect x="20" y="358" width="350" height="298" rx="10" fill="#ffffff" stroke="#d9d8ce"/>
  <text x="38" y="387" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#25342c">Review findings</text>
  <text x="38" y="407" font-family="Arial,sans-serif" font-size="11" fill="#747970">You decide what belongs in the handoff.</text>
  <line x1="38" y1="422" x2="352" y2="422" stroke="#e7e5dc"/>

