  <text x="58" y="452" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#934128">HIGH REVIEW</text>
  <text x="38" y="479" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#24342d">config/.env.local</text>
  <text x="38" y="496" font-family="Arial,sans-serif" font-size="10" fill="#737970">Credential-style filename</text>
  <text x="38" y="512" font-family="Arial,sans-serif" font-size="10" fill="#858980">Contents stay hidden in reports.</text>
  <text x="339" y="480" font-family="Arial,sans-serif" font-size="18" fill="#566158">›</text>
  <line x1="38" y1="526" x2="352" y2="526" stroke="#e7e5dc"/>

