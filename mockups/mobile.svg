  <text x="38" y="582" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#24342d">exports/contact-list.csv</text>
  <text x="38" y="599" font-family="Arial,sans-serif" font-size="10" fill="#737970">Contact details detected · values hidden</text>
  <text x="339" y="583" font-family="Arial,sans-serif" font-size="18" fill="#566158">›</text>
  <line x1="38" y1="613" x2="352" y2="613" stroke="#e7e5dc"/>
  <text x="38" y="639" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#315f44">See all findings</text>
  <text x="268" y="639" font-family="Arial,sans-serif" font-size="10" fill="#737970">3 text files inspected</text>

  <text x="20" y="688" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#25342c">A clean scan is not a safety guarantee.</text>
  <text x="20" y="707" font-family="Arial,sans-serif" font-size="10" fill="#68716a">PDF, Office, image, and archive contents may not be read.</text>
  <text x="20" y="723" font-family="Arial,sans-serif" font-size="10" fill="#68716a">Inspect every file you plan to share.</text>

