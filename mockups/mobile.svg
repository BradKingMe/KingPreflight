  <text x="20" y="135" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1c2d26" letter-spacing="-0.6">folder before it goes.</text>
  <text x="20" y="162" font-family="Arial,sans-serif" font-size="12" fill="#68716a">Check likely sensitive details and easy-to-miss</text>
  <text x="20" y="179" font-family="Arial,sans-serif" font-size="12" fill="#68716a">files before you share.</text>
  <rect x="20" y="196" width="350" height="44" rx="8" fill="#244b3d"/>
