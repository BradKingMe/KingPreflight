  <circle cx="27" cy="789" r="4" fill="#397152"/>
  <text x="39" y="793" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#435149">Your files stay on this device.</text>
  <text x="20" y="813" font-family="Arial,sans-serif" font-size="10" fill="#777d75">No uploads. No changes to the originals.</text>
