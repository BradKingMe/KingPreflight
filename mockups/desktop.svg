  <text x="1025" y="677" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#747970" letter-spacing=".7">NOT A SAFETY GUARANTEE</text>
  <text x="1025" y="703" font-family="Arial,sans-serif" font-size="12" fill="#535d55">A clean scan can still miss sensitive</text>
